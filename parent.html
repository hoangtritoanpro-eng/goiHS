<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#FF2D55">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="manifest" href="manifest.json">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <title>Cổng Phụ Huynh</title>
    <style>
        :root {
            --primary-color: #FF2D55;
            --primary-gradient: linear-gradient(135deg, #FF2D55 0%, #d81b60 100%);
            --success-color: #34C759;
            --bg-color: #F4F5F7;
            --text-color: #111827;
            --card-bg: #FFFFFF;
            --shadow-sm: 0 4px 6px rgba(0,0,0,0.05);
            --shadow-md: 0 10px 20px rgba(255, 45, 85, 0.15);
        }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        .header {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        h1 {
            text-align: center;
            font-size: 24px;
            margin: 0;
            text-transform: uppercase;
            font-weight: 900;
            letter-spacing: -0.5px;
            color: var(--text-color);
        }
        #logoutBtn {
            background-color: transparent;
            color: var(--primary-color);
            border: 1px solid var(--primary-color);
            padding: 8px 16px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
        }
        #logoutBtn:hover {
            background-color: var(--primary-color);
            color: white;
        }
        
        .user-info {
            color: #6B7280;
            font-size: 14px;
            margin-bottom: 20px;
            text-align: center;
        }

        #childrenContainer {
            width: 100%;
            max-width: 400px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            margin-top: 30px;
        }

        .pickup-btn {
            width: 100%;
            border-radius: 24px;
            background: var(--primary-gradient);
            color: white;
            font-size: 22px;
            font-weight: 800;
            border: none;
            box-shadow: var(--shadow-md);
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            padding: 30px 20px;
            box-sizing: border-box;
            outline: none;
            position: relative;
        }
        .pickup-btn:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 25px rgba(255, 45, 85, 0.4);
        }
        .pickup-btn:active {
            transform: scale(0.95) translateY(0);
        }
        .pickup-btn span.class-name {
            display: block;
            font-size: 16px;
            font-weight: 600;
            opacity: 0.9;
            margin-top: 8px;
        }

        .no-data-msg {
            text-align: center;
            color: #888;
            font-size: 16px;
            line-height: 1.5;
            background: white;
            padding: 30px;
            border-radius: 16px;
            box-shadow: var(--shadow-sm);
            margin-top: 20px;
        }

        #notification {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background-color: var(--success-color);
            color: white;
            padding: 18px 25px;
            border-radius: 20px;
            font-size: 16px;
            font-weight: bold;
            box-shadow: 0 10px 25px rgba(52, 199, 89, 0.4);
            opacity: 0;
            transition: opacity 0.3s, transform 0.3s;
            pointer-events: none;
            z-index: 1000;
            text-align: center;
            width: 90%;
            max-width: 400px;
        }
        #notification.show {
            opacity: 1;
            transform: translateX(-50%) translateY(-10px);
        }
    </style>
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>
<body>

    <div class="header">
        <h1>CỔNG PHỤ HUYNH</h1>
        <button id="logoutBtn" onclick="logout()">Đăng xuất</button>
    </div>
    
    <div class="user-info" id="userInfo">Đang kiểm tra đăng nhập...</div>
    
    <div id="childrenContainer">
        <!-- Các nút đón con sẽ render ở đây -->
    </div>

    <div id="notification"></div>

    <!-- Nhúng cấu hình Firebase -->
    <script src="firebase-config.js"></script>
    <script>
        window.onerror = function(msg, url, lineNo, columnNo, error) {
            document.body.innerHTML += '<div style="color:red; background:white; padding:20px; z-index:9999; position:fixed; top:0; left:0; width:100%;">' +
                'ERROR: ' + msg + '<br>Line: ' + lineNo + '<br>' + (error && error.stack ? error.stack : '') + '</div>';
            return false;
        };
    </script>
    <script>
        const userInfo = document.getElementById('userInfo');
        const childrenContainer = document.getElementById('childrenContainer');
        const notification = document.getElementById('notification');
        
        let currentUserEmail = localStorage.getItem('userEmail');
        let studentsList = {};

        if (currentUserEmail) {
            userInfo.textContent = `Tài khoản: ${currentUserEmail}`;
            // Sẽ renderChildren khi dữ liệu Firebase tải xong
        } else {
            window.location.href = 'login.html';
        }

        function logout() {
            localStorage.removeItem('userEmail');
            window.location.href = 'login.html';
        }

        const studentsRef = database.ref('students');
        
        let ignoreWaitTime = false;
        database.ref('settings/ignoreWaitTime').on('value', snap => {
            ignoreWaitTime = !!snap.val();
        });

        studentsRef.on('value', (snapshot) => {
            if (snapshot.exists()) {
                studentsList = snapshot.val();
            } else {
                studentsList = {};
            }
            if (currentUserEmail) {
                renderChildren();
            }
        });

        function renderChildren() {
            childrenContainer.innerHTML = "";
            let foundAny = false;

            for (const id in studentsList) {
                const s = studentsList[id];
                const sEmail = s.parentEmail ? s.parentEmail.toLowerCase() : "";
                
                // Nếu email khớp
                if (sEmail && sEmail === currentUserEmail) {
                    foundAny = true;
                    
                    const btn = document.createElement('button');
                    btn.className = 'pickup-btn';
                    
                    // Nếu bé đã gọi rồi
                    if (s.status === 'called') {
                        btn.style.background = '#888';
                        btn.innerHTML = `ĐÃ GỌI BÉ<br>${s.name} <span class="class-name">Vui lòng chờ ở cổng</span>`;
                        btn.disabled = true;
                    } else if (s.status === 'completed') {
                        btn.style.background = '#34C759';
                        btn.innerHTML = `BÉ ĐÃ VỀ<br>${s.name}`;
                        btn.disabled = true;
                    } else {
                        btn.innerHTML = `ĐÓN BÉ<br>${s.name} <span class="class-name">Lớp ${s.className || 'Chưa rõ'}</span>`;
                        btn.onclick = () => {
                            callStudent(id, s.name, s.className);
                        };
                    }
                    childrenContainer.appendChild(btn);
                }
            }

            if (!foundAny) {
                childrenContainer.innerHTML = `
                    <div class="no-data-msg">
                        Tài khoản của bạn chưa được liên kết với học sinh nào.<br><br>
                        Vui lòng liên hệ Giáo viên Chủ nhiệm hoặc Ban Giám Hiệu để cập nhật Email cho con bạn.
                    </div>
                `;
            }
        }

        function callStudent(id, name, className) {
            const now = Date.now();
            let updates = {};
            let calledNames = [name];

            updates[id + '/status'] = 'called';
            updates[id + '/timestamp'] = now;
            updates[id + '/lastRecall'] = now;

            const pEmail = currentUserEmail;
            if (pEmail && studentsList) {
                for (const sid in studentsList) {
                    const s = studentsList[sid];
                    if (sid !== id && s.parentEmail && s.parentEmail.toLowerCase() === pEmail && s.status !== 'completed') {
                        updates[sid + '/status'] = 'called';
                        updates[sid + '/timestamp'] = now;
                        updates[sid + '/lastRecall'] = now;
                        calledNames.push(s.name);
                    }
                }
            }

            studentsRef.update(updates).then(() => {
                let msg = '';
                const namesStr = calledNames.join(', ');
                if (ignoreWaitTime) {
                    msg = `Đã gửi yêu cầu đón bé <b>${namesStr}</b> thành công.<br>Loa sẽ phát ngay lập tức.`;
                } else {
                    // Tính toán thời gian
                    let timeStr = '16:20 (Tiểu học)';
                    const match = className ? className.match(/^(\d+)/) : null;
                    if (match && parseInt(match[1]) >= 6) {
                        timeStr = '16:40 (THCS)';
                    }
                    msg = `Đã gửi yêu cầu đón bé <b>${namesStr}</b> thành công.<br>Loa sẽ phát vào lúc <b>${timeStr}</b>.`;
                }

                notification.innerHTML = msg;
                notification.classList.add('show');
                
                setTimeout(() => {
                    notification.classList.remove('show');
                }, 5000); // 5s cho Phụ huynh kịp đọc
            }).catch(err => {
                alert("Lỗi: " + err.message);
            });
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#121212">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="manifest" href="manifest.json">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800;900&display=swap" rel="stylesheet">
    <title>Lớp Học - Danh Sách Gọi</title>
    <style>
        :root {
            --bg-color: #0F1115;
            --card-bg: #1F232B;
            --text-color: #F9FAFB;
            --called-color: #FFD60A; /* Màu vàng nổi bật */
            --primary-btn: #007AFF;
            --success-gradient: linear-gradient(135deg, #34C759 0%, #28a745 100%);
            --warning-gradient: linear-gradient(135deg, #FF9500 0%, #FF8000 100%);
            --shadow-lg: 0 15px 35px rgba(0,0,0,0.4);
            --shadow-glow: 0 0 40px rgba(255, 214, 10, 0.4);
        }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 40px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            box-sizing: border-box;
        }
        
        /* Màn hình Start */
        #startScreen {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: var(--bg-color);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        #startBtn {
            font-size: 40px;
            padding: 40px 60px;
            border-radius: 24px;
            background-color: var(--primary-btn);
            color: white;
            border: none;
            font-weight: 800;
            cursor: pointer;
            box-shadow: 0 15px 40px rgba(0, 122, 255, 0.4);
            transition: transform 0.2s, background-color 0.2s;
        }
        #startBtn:active {
            transform: scale(0.95);
            background-color: #0066D6;
        }
        .start-note {
            margin-top: 20px;
            color: #888;
            font-size: 18px;
        }

        /* Màn hình chính */
        #mainScreen {
            display: none;
            flex: 1;
            flex-direction: column;
            align-items: center;
        }
        h1 {
            font-size: 48px;
            margin-bottom: 50px;
            color: #6B7280;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-align: center;
            font-weight: 900;
        }

        #calledList {
            width: 100%;
            max-width: 1000px;
            display: flex;
            flex-direction: column;
            gap: 25px;
        }

        .student-card {
            background-color: var(--card-bg);
            border-left: 12px solid var(--called-color);
            padding: 40px 50px;
            border-radius: 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: var(--shadow-lg);
            animation: slideIn 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275), flash 2s 3;
            transition: transform 0.3s;
        }

        @keyframes slideIn {
            from { transform: translateX(-80px) scale(0.95); opacity: 0; }
            to { transform: translateX(0) scale(1); opacity: 1; }
        }

        /* Hiệu ứng nhấp nháy thu hút sự chú ý */
        @keyframes flash {
            0% { background-color: var(--card-bg); box-shadow: var(--shadow-lg); }
            50% { background-color: #2D2400; box-shadow: var(--shadow-glow); }
            100% { background-color: var(--card-bg); box-shadow: var(--shadow-lg); }
        }

        /* Hiệu ứng cảnh báo quá giờ */
        .timeout-alert {
            border-left-color: #FF3B30 !important;
            animation: alertFlash 1s infinite !important;
        }
        .timeout-alert .student-name {
            color: #FF3B30 !important;
        }
        .timeout-alert::after {
            content: "QUÁ GIỜ!";
            color: white;
            background-color: #FF3B30;
            padding: 8px 16px;
            border-radius: 12px;
            font-size: 18px;
            font-weight: 800;
            position: absolute;
            top: -20px;
            left: 30px;
            box-shadow: 0 5px 15px rgba(255, 59, 48, 0.4);
        }

        @keyframes alertFlash {
            0% { background-color: var(--card-bg); box-shadow: 0 15px 35px rgba(255, 59, 48, 0.2); }
            50% { background-color: #3A0000; box-shadow: 0 0 50px rgba(255, 59, 48, 0.6); }
            100% { background-color: var(--card-bg); box-shadow: 0 15px 35px rgba(255, 59, 48, 0.2); }
        }

        .student-name {
            font-size: 68px;
            font-weight: 900;
            color: var(--called-color);
            margin: 0;
            text-transform: uppercase;
            line-height: 1.1;
            letter-spacing: -2px;
        }

        .done-btn {
            background: var(--success-gradient);
            color: white;
            border: none;
            padding: 25px 45px;
            font-size: 28px;
            font-weight: 900;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.25, 0.8, 0.25, 1);
            box-shadow: 0 10px 25px rgba(52, 199, 89, 0.3);
        }
        .done-btn:active {
            transform: scale(0.95);
        }

        .recall-btn {
            background: var(--warning-gradient);
            color: white;
            border: none;
            padding: 25px 35px;
            font-size: 28px;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.25, 0.8, 0.25, 1);
            box-shadow: 0 10px 25px rgba(255, 149, 0, 0.3);
            margin-right: 20px;
        }
        .recall-btn:active {
            transform: scale(0.95);
        }

        .actions-wrap {
            display: flex;
            align-items: center;
        }

        /* Empty state */
        #emptyState {
            margin-top: 150px;
            font-size: 36px;
            color: #555;
            text-align: center;
            font-weight: 600;
        }

    </style>
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <!-- Canvas Confetti -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
</head>
<body>

    <div id="startScreen">
        <button id="startBtn">BẮT ĐẦU CHẾ ĐỘ ĐÓN</button>
        <div class="start-note">Bắt buộc bấm nút này để kích hoạt âm thanh trên trình duyệt</div>
    </div>

    <div id="mainScreen">
        <h1>DANH SÁCH HỌC SINH ĐƯỢC GỌI</h1>
        <div id="emptyState">Hiện tại chưa có học sinh nào được gọi.</div>
        <div id="calledList"></div>
    </div>

    <!-- Nhúng cấu hình Firebase -->
    <script src="firebase-config.js"></script>
    <script>
        const startBtn = document.getElementById('startBtn');
        const startScreen = document.getElementById('startScreen');
        const mainScreen = document.getElementById('mainScreen');
        const calledList = document.getElementById('calledList');
        const emptyState = document.getElementById('emptyState');

        let isStarted = false;
        let sysVoices = [];
        let globalAudioCtx = null;

        function loadVoices() {
            sysVoices = window.speechSynthesis.getVoices();
        }
        window.speechSynthesis.onvoiceschanged = loadVoices;
        loadVoices();

        // Hàm phát chuông thông báo (Airport Chime)
        function playChime(callback) {
            if (!isStarted) {
                if(callback) callback();
                return;
            }
            try {
                if (!globalAudioCtx) {
                    globalAudioCtx = new (window.AudioContext || window.webkitAudioContext)();
                }
                const ctx = globalAudioCtx;
                if (ctx.state === 'suspended') {
                    ctx.resume();
                }
                
                const osc = ctx.createOscillator();
                const gainNode = ctx.createGain();
                
                osc.connect(gainNode);
                gainNode.connect(ctx.destination);
                
                osc.type = 'sine';
                osc.frequency.setValueAtTime(880, ctx.currentTime); // Note A5 (để tạo tiếng ting ngắn)
                
                gainNode.gain.setValueAtTime(0, ctx.currentTime);
                gainNode.gain.linearRampToValueAtTime(0.8, ctx.currentTime + 0.01);
                gainNode.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.15);
                
                osc.start(ctx.currentTime);
                osc.stop(ctx.currentTime + 0.15);
                
                setTimeout(() => {
                    if (callback) callback();
                }, 150);
            } catch (e) {
                console.error("Audio API error:", e);
                if (callback) callback(); // Dự phòng nếu lỗi
            }
        }

        const audioQueue = [];
        let isPlaying = false;
        let lastSpokenText = "";
        let lastSpokenTime = 0;

        let currentTtsUrl = 'http://127.0.0.1:5000';
        database.ref('settings/ttsUrl').on('value', snap => {
            const val = snap.val();
            if (val) currentTtsUrl = val;
        });

        // Track ID học sinh đã được thông báo "đã về" để không phát lại
        const announcedCompletedIds = new Set();

        async function prefetchBlobAndPlay(text) {
            try {
                const controller = new AbortController();
                // Tạm thời giảm timeout xuống 3s (3000ms) để nếu server tắt thì nó fallback ngay sang giọng Edge
                const timeoutId = setTimeout(() => controller.abort(), 3000);

                const baseUrl = currentTtsUrl.replace(/\/+$/, '');
                const response = await fetch(`${baseUrl}/tts?text=${encodeURIComponent(text)}`, {
                    headers: {
                        "ngrok-skip-browser-warning": "true",
                        "X-Pinggy-No-Screen": "true",
                        "Bypass-Tunnel-Reminder": "true"
                    },
                    signal: controller.signal
                });
                clearTimeout(timeoutId);
                
                if (!response.ok) throw new Error("Network response was not ok");
                const blob = await response.blob();
                const url = URL.createObjectURL(blob);
                
                return {
                    play: (onEnd, onError) => {
                        globalAudioPlayer.src = url;
                        globalAudioPlayer.onended = onEnd;
                        globalAudioPlayer.onerror = onError;
                        globalAudioPlayer.play().catch(onError);
                    }
                };
            } catch (error) {
                console.warn("Lỗi server AI, chuyển sang giọng đọc mặc định của trình duyệt:", error);
                return {
                    play: (onEnd, onError) => {
                        const utterance = new SpeechSynthesisUtterance(text);
                        utterance.lang = 'vi-VN';
                        
                        // Cố gắng tìm giọng Hoài My hoặc giọng tiếng Việt tốt nhất có sẵn từ danh sách đã load
                        if (sysVoices.length === 0) sysVoices = window.speechSynthesis.getVoices();
                        const hoaiMyVoice = sysVoices.find(v => v.name.includes('HoaiMy') || v.name.includes('NamMinh'));
                        const viVoice = sysVoices.find(v => v.lang.includes('vi') || v.lang.includes('VN'));
                        
                        if (hoaiMyVoice) {
                            utterance.voice = hoaiMyVoice;
                        } else if (viVoice) {
                            utterance.voice = viVoice;
                        }

                        let isEnded = false;
                        utterance.onend = () => {
                            if (!isEnded) {
                                isEnded = true;
                                if (onEnd) onEnd();
                            }
                        };
                        utterance.onerror = () => {
                            if (!isEnded) {
                                isEnded = true;
                                if (onError) onError();
                                else if (onEnd) onEnd();
                            }
                        };
                        
                        // Failsafe: nếu kẹt quá 10 giây thì ép cho qua câu tiếp theo
                        setTimeout(() => {
                            if (!isEnded) {
                                isEnded = true;
                                if (onEnd) onEnd();
                            }
                        }, 10000);
                        
                        window.speechSynthesis.speak(utterance);
                    }
                };
            }
        }

        async function playNextInQueue() {
            if (audioQueue.length === 0) {
                isPlaying = false;
                return;
            }
            isPlaying = true;
            const item = audioQueue.shift();
            
            // PHÁT tiếng Ting Ting ngay lập tức để người dùng có phản hồi tức thì
            const chimePromise = new Promise(resolve => playChime(resolve));
            
            let streamPlayer;
            try {
                // Đợi tải xong âm thanh từ máy chủ AI
                streamPlayer = await item.streamPromise;
            } catch (e) {
                console.error("Loi tai am thanh:", e);
                playNextInQueue();
                return;
            }
            
            // Đợi tiếng Ting Ting kêu xong (tránh việc 2 âm thanh đè lên nhau)
            await chimePromise;
            
            // Phát âm thanh mượt mà
            streamPlayer.play(
                () => playNextInQueue(), 
                (e) => {
                    console.error("Loi play:", e);
                    playNextInQueue();
                }
            );
        }

        // Hàm phát âm thanh (có chống đọc lại nếu câu giống nhau)
        function speak(text) {
            if(!isStarted) return;
            
            const now = Date.now();
            if (text === lastSpokenText && (now - lastSpokenTime < 4000)) {
                return; // Chống đọc 2 lần liên tiếp cùng 1 câu
            }
            lastSpokenText = text;
            lastSpokenTime = now;
            speakImmediate(text);
        }

        // Hàm phát âm thanh NGAY LẬP TỨC - bỏ qua anti-duplicate (dùng cho thông báo từ điện thoại)
        function speakImmediate(text) {
            if(!isStarted) return;
            // Khởi tạo tải âm thanh (Blob) NGAY LẬP TỨC
            const streamPromise = prefetchBlobAndPlay(text);
            audioQueue.push({ text, streamPromise });
            if (!isPlaying) {
                playNextInQueue();
            }
        }

        // Tạo sẵn một thẻ Audio dùng chung để lách luật iOS
        const globalAudioPlayer = new Audio();
        globalAudioPlayer.style.display = 'none';
        globalAudioPlayer.playbackRate = 1.0; // Tốc độ bình thường cho Edge TTS (rất rõ ràng)
        globalAudioPlayer.preservesPitch = true; // Giữ nguyên cao độ (không bị méo tiếng)
        document.body.appendChild(globalAudioPlayer);

        // Bắt sự kiện bấm nút Bắt Đầu
        startBtn.addEventListener('click', () => {
            // Mở khóa AudioContext cho trình duyệt di động
            const ctx = new (window.AudioContext || window.webkitAudioContext)();
            const osc = ctx.createOscillator();
            osc.connect(ctx.destination);
            osc.start();
            osc.stop(ctx.currentTime + 0.001);

            // Xóa dòng speak('') vì nó có thể làm treo SpeechSynthesis trên Edge/Chrome
            
            // Mở khóa HTML5 Audio Player (cho iOS Safari)
            globalAudioPlayer.src = 'data:audio/wav;base64,UklGRigAAABXQVZFZm10IBIAAAABAAEARKwAAIhYAQACABAAAABkYXRhAgAAAAEA'; // âm thanh rỗng siêu ngắn
            globalAudioPlayer.play().catch(e => console.log('Unlock audio failed', e));

            // Phát ngay 1 câu thực tế để unlock
            speak("Chế độ đón học sinh đã được kích hoạt.");
            
            isStarted = true;
            startScreen.style.display = 'none';
            mainScreen.style.display = 'flex';
            
            // Bắt đầu lắng nghe dữ liệu từ Firebase
            initFirebaseListener();
        });

        const studentsRef = database.ref('students');
        
        let ignoreWaitTime = false;
        database.ref('settings/ignoreWaitTime').on('value', snap => {
            ignoreWaitTime = !!snap.val();
        });

        let displayedStudents = new Map(); // Lưu ID các học sinh đang hiển thị kèm thông tin
        let pendingSpeakIds = new Set(); // Lưu ID các học sinh đang chờ phát loa

        function getCleanClass(className) {
            let classClean = '';
            if (className && className !== 'Chưa rõ') {
                let match = className.match(/^(\d+)[\/\-_](\d+)/);
                if (match) {
                    const numMapGrade = {'1':'một','2':'hai','3':'ba','4':'bốn','5':'năm','6':'sáu','7':'bảy','8':'tám','9':'chín','10':'mười','11':'mười một','12':'mười hai'};
                    const numMapClass = {'1':'một','2':'hai','3':'ba','4':'tư','5':'năm','6':'sáu','7':'bảy','8':'tám','9':'chín','10':'mười','11':'mười một','12':'mười hai'};
                    classClean = ` ${numMapGrade[match[1]] || match[1]} ${numMapClass[match[2]] || match[2]}`;
                } else {
                    const numMap = {
                        '1': 'một', '2': 'hai', '3': 'ba', '4': 'bốn', '5': 'năm',
                        '6': 'sáu', '7': 'bảy', '8': 'tám', '9': 'chín',
                        '10': 'mười', '11': 'mười một', '12': 'mười hai'
                    };
                    let parts = className.replace(/[\/\-_]/g, ' ').trim().split(' ');
                    classClean = ' ' + parts.map(p => numMap[p] || p).join(' ');
                }
            }
            return classClean;
        }

        function canSpeakNow(className) {
            if (ignoreWaitTime) return true;
            if (!className || className === 'Chưa rõ') return true;
            
            const match = className.match(/^(\d+)/);
            if (!match) return true;
            
            const grade = parseInt(match[1]);
            const now = new Date();
            const currentTimeMinutes = now.getHours() * 60 + now.getMinutes();
            
            if (grade >= 1 && grade <= 5) {
                return currentTimeMinutes >= 980; // 16:20
            } else if (grade >= 6 && grade <= 9) {
                return currentTimeMinutes >= 1000; // 16:40
            }
            return true;
        }

        function updateWaitStatusUI(id, isWaiting, className) {
            const card = document.getElementById(`student-${id}`);
            if (!card) return;
            
            let label = card.querySelector('.wait-label');
            if (isWaiting) {
                if (!label) {
                    label = document.createElement('div');
                    label.className = 'wait-label';
                    label.style.position = 'absolute';
                    label.style.top = '-20px';
                    label.style.right = '30px';
                    label.style.backgroundColor = '#007AFF';
                    label.style.color = 'white';
                    label.style.padding = '8px 16px';
                    label.style.borderRadius = '12px';
                    label.style.fontSize = '18px';
                    label.style.fontWeight = '800';
                    label.style.boxShadow = '0 5px 15px rgba(0, 122, 255, 0.4)';
                    card.appendChild(label);
                }
                const match = className ? className.match(/^(\d+)/) : null;
                let timeStr = '16:20';
                if (match && parseInt(match[1]) >= 6) {
                    timeStr = '16:40';
                }
                label.innerText = `ĐANG CHỜ ĐẾN ${timeStr}`;
                card.style.opacity = '0.7';
            } else {
                if (label) {
                    label.remove();
                }
                card.style.opacity = '1';
            }
        }

        function initFirebaseListener() {
            let initialAnnouncementLoaded = false;
            let lastAnnouncementId = null;

            database.ref('settings/latestAnnouncement').on('value', (snapshot) => {
                if (!isStarted) return;
                const data = snapshot.val();
                if (data && data.text && data.id) {
                    if (!initialAnnouncementLoaded) {
                        initialAnnouncementLoaded = true;
                        lastAnnouncementId = data.id;
                        
                        // Parse timestamp from id (format: timestamp_random)
                        const timestampStr = data.id.split('_')[0];
                        const timestamp = parseInt(timestampStr, 10);
                        // Nếu thông báo vừa được tạo trong vòng 30 giây -> phát ngay!
                        if (!isNaN(timestamp) && Date.now() - timestamp < 30000) {
                            // Dùng speakImmediate để KHÔNG bị anti-duplicate chặn
                            speakImmediate(data.text);
                            lastSpokenText = data.text; // Cập nhật để tránh đọc lại ngay sau
                            lastSpokenTime = Date.now();
                        }
                        return;
                    }
                    
                    if (data.id !== lastAnnouncementId) {
                        lastAnnouncementId = data.id;
                        // Dùng speakImmediate để KHÔNG bị anti-duplicate chặn
                        // (Vì tên học sinh đã được đọc lúc gọi, giờ đọc lại "đã về" sẽ bị block)
                        speakImmediate(data.text);
                        lastSpokenText = data.text;
                        lastSpokenTime = Date.now();
                    }
                } else {
                    initialAnnouncementLoaded = true;
                }
            });

            // Lắng nghe sự thay đổi toàn cục để sắp xếp lại danh sách cho đúng thứ tự
            studentsRef.on('value', (snapshot) => {
                if (!snapshot.exists()) {
                    calledList.innerHTML = '';
                    displayedStudents.clear();
                    updateEmptyState();
                    return;
                }

                let studentsArray = [];
                snapshot.forEach(child => {
                    studentsArray.push({ id: child.key, ...child.val() });
                });

                // Lọc học sinh đang được gọi
                let calledStudents = studentsArray.filter(s => s.status === 'called');
                
                // Sắp xếp theo timestamp tăng dần (Ai gọi trước ở trên cùng)
                calledStudents.sort((a, b) => (a.timestamp || 0) - (b.timestamp || 0));

                // Lưu lại trạng thái DOM cũ để xử lý âm thanh
                const currentDisplayed = new Map(displayedStudents);
                displayedStudents.clear();
                
                // Phát hiện học sinh vừa chuyển sang trạng thái "Đã về"
                if (isStarted) {
                    studentsArray.forEach(data => {
                        if (data.status === 'completed') {
                            // Cách cũ: chỉ phát khi oldData.status === 'called' → BỎ QUA nếu điện thoại gọi+Đã về quá nhanh
                            // Cách mới: phát khi:
                            //   1. Chưa được thông báo (không có trong announcedCompletedIds)
                            //   VÀ
                            //   2a. Vừa chuyển từ called sang completed (oldData.status === 'called') HOẶC
                            //   2b. completedAt timestamp mới (trong vòng 15 giây) – bắt trường hợp điện thoại gọi+Đã về nhanh
                            if (!announcedCompletedIds.has(data.id)) {
                                const oldData = currentDisplayed.get(data.id);
                                const justCompletedViaOldData = oldData && oldData.status === 'called';
                                const justCompletedViaTimestamp = data.completedAt && (Date.now() - data.completedAt < 15000);
                                
                                if (justCompletedViaOldData || justCompletedViaTimestamp) {
                                    announcedCompletedIds.add(data.id);
                                    let classClean = getCleanClass(data.className);
                                    const doneText = `${data.name}${classClean} đã về`;
                                    speakImmediate(doneText);
                                    lastSpokenText = doneText;
                                    lastSpokenTime = Date.now();
                                } else if (!justCompletedViaOldData && !justCompletedViaTimestamp) {
                                    // Completed cũ (trước khi mở trang) → chỉ đánh dấu, không phát
                                    announcedCompletedIds.add(data.id);
                                }
                            }
                        }
                    });
                }

                // Re-render UI
                calledList.innerHTML = '';
                calledStudents.forEach(data => {
                    displayedStudents.set(data.id, data);
                    
                    // Thêm phần tử vào danh sách (đã được sort)
                    addStudentToUI(data.id, data.name, data.className, data.timestamp);

                    // Xử lý phát âm thanh
                    const oldData = currentDisplayed.get(data.id);
                    if (isStarted) {
                        let shouldSpeak = false;
                        
                        // 1. Học sinh mới được gọi
                        if (!oldData) {
                            shouldSpeak = true;
                        } 
                        // 2. Học sinh cũ có yêu cầu nhắc lại (lastRecall thay đổi)
                        else if (data.lastRecall && data.lastRecall !== oldData.lastRecall) {
                            shouldSpeak = true;
                        }

                        if (shouldSpeak) {
                            pendingSpeakIds.add(data.id);
                        }
                    }
                });

                updateEmptyState();
                processPendingSpeak();
            });
        }

        function addStudentToUI(id, name, className, timestamp) {
            const card = document.createElement('div');
            card.className = 'student-card';
            card.id = `student-${id}`;
            card.style.position = 'relative'; // Cho label "QUÁ GIỜ"
            card.style.transition = 'transform 0.3s, opacity 0.3s';
            
            let classDisplay = className && className !== 'Chưa rõ' ? ` - ${className}` : '';
            
            card.innerHTML = `
                <h2 class="student-name" style="cursor: pointer; user-select: none;" onclick="triggerRecall('${id}')" title="Nhấn để nhắc lại âm thanh">
                    ${name}<span style="font-size: 32px; color: #888;">${classDisplay}</span>
                </h2>
                <div class="actions-wrap">
                    <button class="recall-btn" onclick="triggerRecall('${id}')">🔊</button>
                    <button class="done-btn" onclick="markAsCompleted('${id}')">ĐÃ VỀ</button>
                </div>
            `;
            
            // Xử lý sự kiện vuốt ngang (Hỗ trợ cả Chuột và Cảm ứng qua Pointer Events)
            let startX = 0;
            let isSwiping = false;

            card.addEventListener('pointerdown', e => {
                // Bỏ qua nếu nhấn vào các nút button
                if(e.target.tagName === 'BUTTON') return;
                
                startX = e.clientX;
                isSwiping = true;
                card.setPointerCapture(e.pointerId);
            });

            card.addEventListener('pointerup', e => {
                if (!isSwiping) return;
                isSwiping = false;
                card.releasePointerCapture(e.pointerId);
                
                let endX = e.clientX;
                let swipeDistance = endX - startX;
                
                // Nếu vuốt ngang (trái hoặc phải) > 100px thì xóa (Đã về)
                if (Math.abs(swipeDistance) > 100) {
                    card.style.transform = swipeDistance > 0 ? 'translateX(100%)' : 'translateX(-100%)';
                    card.style.opacity = '0';
                    setTimeout(() => {
                        window.markAsCompleted(id);
                    }, 300);
                }
            });
            
            // Thêm vào danh sách theo thứ tự vòng lặp đã sort
            calledList.appendChild(card);
        }

        function processPendingSpeak() {
            if (!isStarted || pendingSpeakIds.size === 0) return;
            
            let sortedStudents = Array.from(displayedStudents.values())
                .filter(s => pendingSpeakIds.has(s.id))
                .sort((a, b) => (a.timestamp || 0) - (b.timestamp || 0));
                
            sortedStudents.forEach(data => {
                if (canSpeakNow(data.className)) {
                    pendingSpeakIds.delete(data.id);
                    updateWaitStatusUI(data.id, false);
                    
                    let classClean = getCleanClass(data.className);
                    speak(`${data.name}${classClean}`);
                } else {
                    updateWaitStatusUI(data.id, true, data.className);
                }
            });
        }

        // Timer xử lý hàng đợi phát loa (dành cho những học sinh đang chờ đến giờ)
        setInterval(processPendingSpeak, 1000);

        // Logic cảnh báo quá 5 phút (300,000 ms)
        setInterval(() => {
            const now = Date.now();
            displayedStudents.forEach((data, id) => {
                if (now - data.timestamp > 300000) {
                    const card = document.getElementById(`student-${id}`);
                    if (card && !card.classList.contains('timeout-alert')) {
                        card.classList.add('timeout-alert');
                    }
                }
            });
        }, 10000); // Check mỗi 10 giây

        let previousStudentCount = -1;

        function updateEmptyState() {
            const currentCount = displayedStudents.size;
            
            if (currentCount === 0) {
                emptyState.style.display = 'block';
                
                // Nếu vừa có học sinh về hết -> Bắn pháo hoa
                if (previousStudentCount > 0) {
                    confetti({
                        particleCount: 200,
                        spread: 120,
                        origin: { y: 0.6 },
                        colors: ['#FFD60A', '#34C759', '#007AFF', '#FF3B30']
                    });
                }
            } else {
                emptyState.style.display = 'none';
            }
            
            previousStudentCount = currentCount;
        }

        // Hàm được gọi khi giáo viên bấm nút "Đã về"
        window.markAsCompleted = function(id) {
            studentsRef.child(id).update({
                status: 'completed',
                completedAt: Date.now()
            }).catch(err => {
                alert("Lỗi cập nhật trạng thái: " + err.message);
                console.error("Lỗi cập nhật trạng thái:", err);
            });
        }

        // Hàm được gọi khi giáo viên bấm nút Nhắc lại (Loa)
        window.triggerRecall = function(id) {
            studentsRef.child(id).update({ lastRecall: Date.now() });
        }
    </script>
</body>
</html>
